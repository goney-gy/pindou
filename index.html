<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拼豆图纸GO</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#F3F4F6;color:#1F2937;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.page{max-width:560px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom))}
.hero{padding:12px 4px 24px}
.hero-title{font-size:26px;font-weight:700;letter-spacing:1px;margin:0}
.hero-sub{margin-top:6px;font-size:13px;color:#6B7280}
.card{background:#FFF;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(31,41,55,.06)}
.upload-card{padding:6px;overflow:hidden;cursor:pointer}
.upload-preview{width:100%;max-height:300px;border-radius:12px;display:block;background:#FAFAFC}
.upload-placeholder{height:210px;border:3px dashed #C7CBD5;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FAFAFC;color:#6B7280;text-align:center}
.upload-icon{font-size:48px;color:#A5B4FC;line-height:1}
.upload-text{margin-top:12px;font-size:15px}
.upload-hint{margin-top:6px;font-size:12px;color:#9CA3AF}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:46px;border:none;border-radius:12px;font-size:15px;font-weight:600;margin-bottom:14px;cursor:pointer;font-family:inherit}
.btn:active{opacity:.85}
.btn-primary{background:#E0E7FF;color:#4338CA}
.btn-generate{background:linear-gradient(90deg,#6366F1,#8B5CF6);color:#FFF;box-shadow:0 8px 24px rgba(99,102,241,.35)}
.btn-generate:disabled{background:#E5E7EB;color:#9CA3AF;box-shadow:none;cursor:not-allowed}
.btn-action{flex:1;background:#EEF2FF;color:#4338CA;margin-bottom:0}
.btn-ghost{background:#FFF;color:#374151;border:1px solid #D1D5DB}
.section-title{font-size:13px;font-weight:600;color:#374151;margin:16px 0 10px}
.section-title:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap}
.chip{padding:7px 14px;margin:0 8px 8px 0;border-radius:999px;background:#F3F4F6;color:#6B7280;font-size:13px;border:1px solid transparent;cursor:pointer;user-select:none}
.chip-active{background:#EEF2FF;color:#4338CA;border-color:#6366F1;font-weight:600}
.custom-row{display:flex;align-items:center;margin-top:10px}
.custom-input{flex:1;height:36px;background:#F9FAFB;border-radius:8px;padding:0 12px;font-size:14px;border:1px solid #E5E7EB;outline:none;min-width:0}
.custom-btn{margin-left:8px;padding:0 16px;height:36px;line-height:36px;border-radius:8px;background:#F3F4F6;color:#9CA3AF;font-size:13px;cursor:pointer;border:none}
.custom-btn.on{background:#EEF2FF;color:#4338CA}
.opt-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-size:14px;color:#374151}
.switch{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#CBD5E1;border-radius:999px;transition:.2s;cursor:pointer}
.switch span::before{content:"";position:absolute;width:20px;height:20px;left:2px;top:2px;background:#FFF;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+span{background:#6366F1}
.switch input:checked+span::before{transform:translateX(20px)}
.result-card{padding:12px}
.result-tabs{display:flex;background:#F3F4F6;border-radius:10px;padding:3px;margin-bottom:12px}
.tab{flex:1;text-align:center;padding:8px 0;font-size:13px;color:#6B7280;border-radius:8px;cursor:pointer}
.tab-active{background:#FFF;color:#4338CA;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.canvas-wrap{width:100%;height:58vh;background:#FFF;border:1px solid #E5E7EB;border-radius:12px;overflow:hidden;position:relative;touch-action:none}
.sheet-canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.sheet-canvas:active{cursor:grabbing}
.result-info{display:flex;align-items:center;justify-content:space-between;padding:12px 4px 0;font-size:12px;color:#6B7280}
.zoom-hint{color:#9CA3AF;white-space:nowrap}
.stats-block{margin-top:14px;border-top:1px solid #F3F4F6;padding-top:12px}
.stats-title{font-size:14px;font-weight:600;color:#374151;margin-bottom:10px}
.stats-grid{display:flex;flex-wrap:wrap}
.stats-item{display:flex;align-items:center;background:#F9FAFB;border-radius:8px;padding:6px 10px;width:calc(50% - 6px);margin:0 6px 6px 0}
.swatch{width:22px;height:22px;border-radius:5px;border:1px solid #E5E7EB;margin-right:8px;flex-shrink:0}
.stats-cell{display:flex;flex-direction:column;min-width:0}
.stats-code{font-size:13px;font-weight:600;color:#374151}
.stats-count{font-size:11px;color:#9CA3AF;margin-top:1px}
.audit-block{margin-top:14px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:10px 14px;font-size:12px;color:#92400E}
.action-bar{display:flex;margin-top:4px}
.action-bar .btn-action+.btn-action{margin-left:10px}
.footer-note{text-align:center;font-size:11px;color:#9CA3AF;padding:20px 0 6px}
[hidden]{display:none!important}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(17,24,39,.9);color:#FFF;font-size:13px;padding:10px 18px;border-radius:8px;z-index:99;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.save-mask{position:fixed;inset:0;background:rgba(17,24,39,.55);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px}
.save-card{background:#FFF;border-radius:16px;width:100%;max-width:380px;padding:18px;box-sizing:border-box}
.save-title{font-size:16px;font-weight:600;color:#111827;margin-bottom:12px;text-align:center}
.save-sheet{width:100%;border:1px dashed #D1D5DB;border-radius:10px;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:10px}
.save-sheet img{max-width:100%;max-height:46vh;border-radius:8px}
.save-sheet .sheet-name{font-size:12px;color:#6B7280;word-break:break-all;text-align:center}
.save-hint{font-size:12px;color:#9CA3AF;margin:10px 4px;text-align:center;line-height:1.5}
.save-actions{display:flex;gap:10px}
.save-actions .btn{flex:1}
.save-close{margin-top:12px;width:100%;background:#FFF;border:1px solid #D1D5DB;color:#374151;padding:11px;border-radius:10px;font-size:14px}
@media (min-width:600px){.canvas-wrap{height:520px}}
</style>
</head>
<body>
<div class="page">
  <header class="hero">
    <h1 class="hero-title">拼豆图纸GO</h1>
    <p class="hero-sub">上传图片 → 一键生成带色号的拼豆图纸，全部本机处理</p>
  </header>

  <input type="file" id="fileInput" accept="image/*" hidden>
  <section class="card upload-card" id="uploadCard">
    <img id="uploadPreview" class="upload-preview" alt="" hidden>
    <div id="uploadPlaceholder" class="upload-placeholder">
      <div class="upload-icon">＋</div>
      <div class="upload-text">点击选择图片</div>
      <div class="upload-hint">支持相册选图与拍照</div>
    </div>
  </section>
  <button class="btn btn-primary" id="chooseBtn">选择图片</button>

  <section class="card">
    <div class="section-title">网格尺寸</div>
    <div class="chips" id="sizeChips"></div>
    <div class="custom-row">
      <input class="custom-input" id="customInput" type="number" min="8" max="150" placeholder="自定义 8~150">
      <button class="custom-btn" id="customApply">应用</button>
    </div>
    <div class="section-title">色号系统</div>
    <div class="chips" id="systemChips"></div>
    <div class="section-title">颜色匹配</div>
    <div class="chips" id="matchChips"></div>
    <div class="section-title">最多用色（限色收敛）</div>
    <div class="chips" id="maxColorChips"></div>
    <div class="section-title">图纸选项</div>
    <div class="opt-row"><span>近白区域留空（不买豆）</span><label class="switch"><input type="checkbox" id="optBlank" checked><span></span></label></div>
    <div class="opt-row"><span>格内显示色号</span><label class="switch"><input type="checkbox" id="optNumbers" checked><span></span></label></div>
    <div class="opt-row"><span>四周行列坐标</span><label class="switch"><input type="checkbox" id="optCoords" checked><span></span></label></div>
    <div class="opt-row"><span>网格加重线（每 10 格）</span><label class="switch"><input type="checkbox" id="optGrid" checked><span></span></label></div>
    <div class="opt-row"><span>底部色号用量统计</span><label class="switch"><input type="checkbox" id="optStats" checked><span></span></label></div>
    <div class="opt-row"><span>标记孤立豆（结构检查）</span><label class="switch"><input type="checkbox" id="optHighlight"><span></span></label></div>
  </section>
  <button class="btn btn-generate" id="generateBtn">生成图纸</button>

  <section class="card result-card" id="resultCard" hidden>
    <div class="result-tabs">
      <div class="tab tab-active" data-mode="pattern">图纸</div>
      <div class="tab" data-mode="original">原图对比</div>
      <div class="tab" data-mode="blank">只留空格</div>
    </div>
    <div class="canvas-wrap">
      <canvas id="sheetCanvas" class="sheet-canvas"></canvas>
    </div>
    <div class="result-info">
      <span id="gridInfo"></span>
      <span class="zoom-hint">滚轮/双指缩放 · 拖拽平移</span>
    </div>
    <div class="stats-block" id="statsBlock" hidden>
      <div class="stats-title">色号用量清单</div>
      <div class="stats-grid" id="statsGrid"></div>
    </div>
    <div class="audit-block" id="auditBlock" hidden></div>
  </section>

  <div class="action-bar" id="actionBar" hidden>
    <button class="btn btn-action" id="exportPng">导出图纸 PNG</button>
    <button class="btn btn-action btn-ghost" id="exportCsv">导出物料清单 CSV</button>
  </div>

  <footer class="footer-note">所有图片仅在本机处理，不会上传任何服务器</footer>
</div>

<div class="save-mask" id="saveMask" hidden>
  <div class="save-card">
    <div class="save-title" id="saveTitle">保存文件</div>
    <div class="save-sheet" id="saveSheet"></div>
    <div class="save-hint" id="saveHint"></div>
    <div class="save-actions">
      <button class="btn btn-action" id="saveDownload">下载文件</button>
      <button class="btn btn-action btn-ghost" id="saveShare" hidden>分享</button>
    </div>
    <button class="save-close" id="saveClose">关闭</button>
  </div>
</div>

function hexToRgb(hex) {
  return { r: parseInt(hex.slice(1,3),16), g: parseInt(hex.slice(3,5),16), b: parseInt(hex.slice(5,7),16) };

function rgbToLab({r,g,b}) {
  const f = x => { x/=255; return x<=0.04045 ? x/12.92 : Math.pow((x+0.055)/1.055,2.4); };

  let x = (rl*0.4124+gl*0.3576+bl*0.1805)/0.95047;
  let y = rl*0.2126+gl*0.7152+bl*0.0722;
  let z = (rl*0.0193+gl*0.1192+bl*0.9505)/1.08883;
  const g2 = t => (t>0.008856 ? Math.cbrt(t) : 7.787*t+16/116);

function rgbDistance(c1,c2) {

const PALETTE_RGB = [], PALETTE_LAB = [];
PALETTE.forEach((p,i) => { const rgb = hexToRgb(p.hex); PALETTE_RGB[i]=rgb; PALETTE_LAB[i]=rgbToLab(rgb); });
function matchRgb(r,g,b,mode) {
  if (mode==='lab') {
    const t = rgbToLab({r,g,b});
    let best=ALL_HEX[0], bestDist=Infinity;
    for (let i=0;i<ALL_HEX.length;i++) { const d=labDistance(t,PALETTE_LAB[i]); if(d<bestDist){bestDist=d;best=ALL_HEX[i];} }
    return best;
  }
  let best=ALL_HEX[0], bestDist=Infinity;
  for (let i=0;i<ALL_HEX.length;i++) { const d=rgbDistance({r,g,b},PALETTE_RGB[i]); if(d<bestDist){bestDist=d;best=ALL_HEX[i];} }

    const d = mode==='lab' ? labDistance(rgbToLab(t),rgbToLab(target)) : rgbDistance(t,target);

function getColorKeyByHex(hex,colorSystem) {

  if (hit!==undefined) return hit;
  const c = HEX_MAP[hex.toUpperCase()];
  let out;
  if (!c) out = hex;
  else {
    const idx = BRANDS.indexOf(colorSystem);

function countColors(pixelData) {

  for (const color of pixelData) {

    const key = color.toUpperCase();
    counts[key]=(counts[key]||0)+1;
  }

}
function sortedColorKeys(counts) {

  for (const k of keys) {
    const spare = Math.ceil(counts[k]*1.1);
    lines.push(`${getColorKeyByHex(k,colorSystem)},${k},${counts[k]},${spare}`);

function quantizeImageData(imageData,opts) {

    } else {

function auditStructure(pixelData,n) {
  const idx = i => i>=0 && i<n;
  const cellAt = (r,c) => (idx(r)&&idx(c) ? pixelData[r*n+c] : BLANK);
  const isolated=[], diagonalOnly=[];
  for (let r=0;r<n;r++) {
    for (let c=0;c<n;c++) {
      const i = r*n+c;
      if (pixelData[i]===BLANK) continue;
      const up=cellAt(r-1,c), down=cellAt(r+1,c), left=cellAt(r,c-1), right=cellAt(r,c+1);
      const ortho=[up,down,left,right].filter(v=>v!==BLANK).length;
      if (ortho===0) {
        const diag=[cellAt(r-1,c-1),cellAt(r-1,c+1),cellAt(r+1,c-1),cellAt(r+1,c+1)].filter(v=>v!==BLANK).length;
        if (diag>0) diagonalOnly.push(i);
        else isolated.push(i);
      }
    }

function rr(ctx,x,y,w,h,r) {
  if (typeof r==='number') r=[r,r,r,r];
  const [tl,tr,br,bl]=[r[0],r[1],r[2],r[3]];
  ctx.beginPath();
  ctx.moveTo(x+tl,y);
  ctx.lineTo(x+w-tr,y);
  ctx.arcTo(x+w,y,x+w,y+tr,tr);
  ctx.lineTo(x+w,y+h-br);
  ctx.arcTo(x+w,y+h,x+w-br,y+h,br);
  ctx.lineTo(x+bl,y+h);
  ctx.arcTo(x,y+h,x,y+h-bl,bl);
  ctx.lineTo(x,y+tl);
  ctx.arcTo(x,y,x+tl,y,tl);
  ctx.closePath();

function computeLayout(data,opts,CELL) {
  const N = data.gridSize;
  const showCoordinates = opts.showCoordinates!==false;
  const includeStats = opts.includeStats!==false;
  const axisLabelSize = showCoordinates ? Math.max(30,Math.floor(CELL)) : 0;
  const statsPadding = 20;
  const preCalcWidth = N*CELL+axisLabelSize;
  const preCalcAvailableWidth = preCalcWidth-statsPadding*2;
  const widthFactor = Math.max(0,preCalcAvailableWidth-350)/600;
  const statsFontSize = Math.floor(13+widthFactor*10);
  const extraLeftMargin = showCoordinates ? Math.max(20,statsFontSize*2) : 0;
  const extraRightMargin = showCoordinates ? Math.max(20,statsFontSize*2) : 0;
  const extraTopMargin = showCoordinates ? Math.max(15,statsFontSize) : 0;
  const extraBottomMargin = showCoordinates ? Math.max(15,statsFontSize) : 0;
  const gridWidth = N*CELL;
  const gridHeight = N*CELL;
  const initialWidth = gridWidth+axisLabelSize+extraLeftMargin;
  const titleBarScale = Math.max(1.0,Math.min(2.0,initialWidth/1000));
  const titleBarHeight = Math.floor(80*titleBarScale);
  const titleFontSize = Math.max(28,Math.floor(28*titleBarScale));
  const colorCounts = countColors(data.pixelData);
  const totalBeadCount = Object.values(colorCounts).reduce((s,c)=>s+c,0);
  const colorKeys = sortedColorKeys(colorCounts);
  let statsHeight = 0;
  if (includeStats && colorKeys.length>0) {
    const numColumns = Math.max(1,Math.min(4,Math.floor(preCalcAvailableWidth/250)));
    const swatchSize = Math.floor(18+widthFactor*20);
    const numRows = Math.ceil(colorKeys.length/numColumns);
    const statsRowHeight = Math.max(swatchSize+8,25);
    statsHeight = 40+numRows*statsRowHeight+40+statsPadding*2+24;
  }
  const width = gridWidth+axisLabelSize*2+extraLeftMargin+extraRightMargin;
  const height = titleBarHeight+gridHeight+axisLabelSize*2+statsHeight+extraTopMargin+extraBottomMargin;
  return {
    CELL,N,axisLabelSize,statsPadding,widthFactor,statsFontSize,
    extraLeftMargin,extraRightMargin,extraTopMargin,extraBottomMargin,
    gridWidth,gridHeight,titleBarHeight,titleFontSize,
    colorCounts,totalBeadCount,colorKeys,statsHeight,
    width,height,
    gridX:extraLeftMargin+axisLabelSize,

}

      const count=colorCounts[key];
      ctx.fillStyle=key;
      ctx.fillRect(itemX,rowY-swatchSize/2,swatchSize,swatchSize);
      ctx.strokeStyle='#CCCCCC';
      ctx.lineWidth=1;
      ctx.strokeRect(itemX,rowY-swatchSize/2,swatchSize,swatchSize);
      ctx.fillStyle='#333333';
      ctx.font=`${statsFontSize}px ${FONT_STACK}`;
      ctx.textAlign='left';
      ctx.fillText(getColorKeyByHex(key,system),itemX+swatchSize+5,rowY);
      const countX = numColumns===1 ? W-statsPadding : itemX+itemWidth-10;
      ctx.textAlign='right';
      ctx.fillText(`${count} 颗`,countX,rowY);
    });
    const numRows = Math.ceil(colorKeys.length/numColumns);
    const totalY = statsY+titleHeight+numRows*statsRowHeight+10;
    ctx.font=`bold ${statsFontSize}px ${FONT_STACK}`;
    ctx.textAlign='right';
    ctx.fillText(`总计: ${totalBeadCount} 颗`,W-statsPadding,totalY);
  }
}

const state = {
  gridSize:32, customSize:'', colorSystem:'MARD', match:'lab', maxColors:0,
  opts:{ blankWhite:true, showNumbers:true, showCoords:true, showGrid:true, showStats:true, highlight:false },
  viewMode:'pattern', sourceImage:null, fileName:'',
  result:null, audit:null, auditText:'', stats:[], layout:null, drawOpts:null,
  view:null, fitScale:1, ctx:null, cssW:0, cssH:0, rafId:0,
};
const DPR = window.devicePixelRatio||1;

const $ = id => document.getElementById(id);
const uploadCard=$('uploadCard'), fileInput=$('fileInput'), uploadPreview=$('uploadPreview'), uploadPlaceholder=$('uploadPlaceholder');
const chooseBtn=$('chooseBtn'), generateBtn=$('generateBtn');
const resultCard=$('resultCard'), actionBar=$('actionBar'), gridInfo=$('gridInfo');
const statsBlock=$('statsBlock'), statsGrid=$('statsGrid'), auditBlock=$('auditBlock');
const canvas=$('sheetCanvas'), customInput=$('customInput'), customApply=$('customApply');

function toast(msg) {
  const t=document.createElement('div');
  t.className='toast';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),1800);
}

function renderChips(el,items,getValue,onSet) {
  el.innerHTML='';
  items.forEach(it=>{
    const b=document.createElement('button');
    b.className='chip'+(String(it.v)===String(getValue())?' chip-active':'');
    b.textContent=it.label;
    b.addEventListener('click',()=>{ onSet(it.v); renderChips(el,items,getValue,onSet); });
    el.appendChild(b);
  });
}

function refresh() {
  renderChips($('sizeChips'),[{v:16,label:'16×16'},{v:24,label:'24×24'},{v:32,label:'32×32'},{v:48,label:'48×48'},{v:56,label:'56×56'},{v:64,label:'64×64'},{v:100,label:'100×100'}],()=>state.gridSize,v=>{state.gridSize=v;state.customSize='';customInput.value='';if(state.result)generate();});
  renderChips($('systemChips'),[{v:'MARD',label:'MARD 221色'},{v:'COCO',label:'COCO'},{v:'漫漫',label:'漫漫'},{v:'盼盼',label:'盼盼'},{v:'咪小窝',label:'咪小窝'}],()=>state.colorSystem,v=>{state.colorSystem=v;if(state.result)generate();});
  renderChips($('matchChips'),[{v:'lab',label:'Lab 感知'},{v:'rgb',label:'RGB 距离'}],()=>state.match,v=>{state.match=v;if(state.result)generate();});
  renderChips($('maxColorChips'),[{v:0,label:'不限'},{v:12,label:'≤12 色'},{v:16,label:'≤16 色'},{v:24,label:'≤24 色'},{v:32,label:'≤32 色'},{v:48,label:'≤48 色'}],()=>state.maxColors,v=>{state.maxColors=v;if(state.result)generate();});
}

function readImage(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload=()=>{
    state.sourceImage=img;
    state.fileName=file.name.replace(/\.[^.]+$/,'');
    uploadPreview.src=url;
    uploadPreview.hidden=false;
    uploadPlaceholder.hidden=true;
    state.result=null;
    resultCard.hidden=true;
    actionBar.hidden=true;
  };
  img.onerror=()=>{ toast('图片读取失败，请更换图片'); };
  img.src=url;
}

function buildDrawOpts() {
  const o=state.opts;
  state.drawOpts={
    showGrid:o.showGrid, gridInterval:10,
    showCoordinates:o.showCoords, showCellNumbers:o.showNumbers,
    includeStats:o.showStats, system:state.colorSystem,
    title:'拼豆图纸', watermark:'', highlightIsolated:o.highlight,
  };
}

function buildStats() {
  const counts=countColors(state.result.pixelData);
  const keys=sortedColorKeys(counts);
  state.stats=keys.map(k=>({ hex:k, code:getColorKeyByHex(k,state.colorSystem), count:counts[k], spare:Math.ceil(counts[k]*1.1) }));
  state.audit=auditStructure(state.result.pixelData,state.result.gridSize);
  const parts=[];
  if (state.audit.isolatedCount) parts.push(`孤立豆 ${state.audit.isolatedCount} 个（建议补豆加固）`);
  if (state.audit.diagonalOnlyCount) parts.push(`仅对角接触 ${state.audit.diagonalOnlyCount} 个（建议增加连接）`);
  state.auditText=parts.join('；');
}

function renderStats() {
  const counts=countColors(state.result.pixelData);
  const total=Object.values(counts).reduce((s,c)=>s+c,0);
  const keys=sortedColorKeys(counts);
  gridInfo.textContent=`${state.result.gridSize}×${state.result.gridSize} 网格 · ${keys.length} 种色号 · ${total} 颗豆`;
  if (state.stats.length) {
    statsBlock.hidden=false;
    statsGrid.innerHTML='';
    state.stats.forEach(it=>{
      const el=document.createElement('div'); el.className='stats-item';
      const sw=document.createElement('div'); sw.className='swatch'; sw.style.background=it.hex;
      const cell=document.createElement('div'); cell.className='stats-cell';
      const code=document.createElement('span'); code.className='stats-code'; code.textContent=it.code;
      const cnt=document.createElement('span'); cnt.className='stats-count'; cnt.textContent=`${it.count} 颗 · 备 ${it.spare}`;
      cell.appendChild(code); cell.appendChild(cnt);
      el.appendChild(sw); el.appendChild(cell);
      statsGrid.appendChild(el);
    });
  } else {
    statsBlock.hidden=true;
  }
  if (state.auditText) { auditBlock.hidden=false; auditBlock.textContent=state.auditText; }
  else auditBlock.hidden=true;
}

function generate() {
  if (!state.sourceImage) { toast('请先选择图片'); return; }
  const n=state.gridSize;
  generateBtn.disabled=true;
  generateBtn.textContent='生成中…';
  setTimeout(()=>{
    try {
      const off=document.createElement('canvas');
      off.width=n; off.height=n;
      const octx=off.getContext('2d');
      const iw=state.sourceImage.naturalWidth, ih=state.sourceImage.naturalHeight;
      const s=Math.min(n/iw,n/ih);
      const dw=iw*s, dh=ih*s;
      octx.fillStyle='#FFFFFF';
      octx.fillRect(0,0,n,n);
      octx.drawImage(state.sourceImage,(n-dw)/2,(n-dh)/2,dw,dh);
      const imageData=octx.getImageData(0,0,n,n);
      let pixelData=quantizeImageData(imageData,{match:state.match,blankWhite:state.opts.blankWhite,whiteThreshold:240}).pixelData;
      if (state.maxColors>0) pixelData=limitColors(pixelData,state.maxColors,state.match);
      state.result={gridSize:n,pixelData};
      buildDrawOpts();
      buildStats();
      state.layout=computeLayout(state.result,state.drawOpts,28);
      resultCard.hidden=false;
      actionBar.hidden=false;
      renderStats();
      initCanvas();
      render();
      toast('生成完成');
    } catch (err) {
      toast('生成失败，请重试');
    }
    generateBtn.disabled=false;
    generateBtn.textContent='生成图纸';
  },30);
}

function initCanvas() {
  const wrap=document.querySelector('.canvas-wrap');
  const cw=wrap.clientWidth, ch=wrap.clientHeight;
  canvas.width=Math.max(1,Math.floor(cw*DPR));
  canvas.height=Math.max(1,Math.floor(ch*DPR));
  state.cssW=cw; state.cssH=ch;
  state.ctx=canvas.getContext('2d');
  fit();
}

function fit() {
  const l=state.layout;
  state.fitScale=Math.min(state.cssW/l.width,state.cssH/l.height)*0.95;
  state.view={scale:state.fitScale,tx:(state.cssW-l.width*state.fitScale)/2,ty:(state.cssH-l.height*state.fitScale)/2};
}

function render() {
  if (!state.ctx||!state.layout||!state.view) return;
  const ctx=state.ctx, view=state.view;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const mode=state.viewMode;
  if (mode==='original') {
    ctx.setTransform(DPR*view.scale,0,0,DPR*view.scale,DPR*view.tx,DPR*view.ty);
    ctx.fillStyle='#FFFFFF';
    ctx.fillRect(0,0,state.layout.width,state.layout.height);
    ctx.drawImage(state.sourceImage,0,0,state.layout.width,state.layout.height);
    return;
  }
  let opts={...state.drawOpts};
  let data=state.result;
  if (mode==='blank') {
    data={gridSize:state.result.gridSize,pixelData:state.result.pixelData.map(c=>(c===BLANK?BLANK:'#F3F4F8'))};
    opts={...opts,showCellNumbers:false,includeStats:false,showCoordinates:false,highlightIsolated:false};
  } else if (mode==='pattern') {
    if (!state.opts.showNumbers||view.scale<2.5) opts={...opts,showCellNumbers:false};
  }
  ctx.setTransform(DPR*view.scale,0,0,DPR*view.scale,DPR*view.tx,DPR*view.ty);
  const drawOpts={...opts,highlightIsolated:state.opts.highlight};
  if (state.audit) {
    drawOpts.isolatedSet=new Set(state.audit.isolated);
    drawOpts.diagonalSet=new Set(state.audit.diagonalOnly);
  }
  drawSheet(ctx,state.layout,data,drawOpts);
}

function zoomAt(px,py,ratio) {
  const newScale=Math.max(state.fitScale*0.2,Math.min(state.fitScale*25,state.view.scale*ratio));
  const k=newScale/state.view.scale;
  state.view.tx=px-(px-state.view.tx)*k;
  state.view.ty=py-(py-state.view.ty)*k;
  state.view.scale=newScale;
  scheduleRender();
}

function scheduleRender() {
  if (state.rafId) return;
  state.rafId=requestAnimationFrame(()=>{ state.rafId=0; render(); });
}

const saveMask=$('saveMask'), saveSheet=$('saveSheet'), saveTitle=$('saveTitle'), saveHint=$('saveHint'), saveDownload=$('saveDownload'), saveShare=$('saveShare'), saveClose=$('saveClose');
let saveBlob=null, saveName='';
function isMobile() {
  return /Android|iPhone|iPad|iPod|Mobile|PlayBook|Silk/i.test(navigator.userAgent);
}
function canShareFiles() {
  return !!(navigator.share && navigator.canShare && navigator.canShare({ files: [new File(['x'],'x.txt')] }));
}
function openSaveSheet(title,blob,name,hint,previewUrl) {
  saveBlob=blob; saveName=name;
  saveTitle.textContent=title;
  saveHint.textContent=hint||'';
  saveSheet.innerHTML='';
  if (previewUrl) {
    const img=document.createElement('img');
    img.src=previewUrl;
    img.alt='图纸预览';
    saveSheet.appendChild(img);
  }
  const nm=document.createElement('div');
  nm.className='sheet-name';
  nm.textContent=name;
  saveSheet.appendChild(nm);
  saveShare.hidden=!canShareFiles();
  saveMask.hidden=false;
}
function closeSaveSheet() {
  saveMask.hidden=true;
  saveSheet.innerHTML='';
  if (saveBlob && saveBlob.url) URL.revokeObjectURL(saveBlob.url);
  saveBlob=null;
}
saveDownload.addEventListener('click',()=>{
  if (!saveBlob) return;
  const a=document.createElement('a');
  a.href=saveBlob.url;
  a.download=saveName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('已开始下载，请在浏览器下载记录中查看');
});
saveShare.addEventListener('click',async()=>{
  if (!saveBlob || !navigator.share) return;
  try {
    await navigator.share({
      title: saveName,
      files: [new File([saveBlob.file], saveName, { type: saveBlob.file.type })],
    });
  } catch (err) {
    if (err && err.name !== 'AbortError') toast('分享失败');
  }
});
saveClose.addEventListener('click',closeSaveSheet);
saveMask.addEventListener('click',e=>{ if (e.target===saveMask) closeSaveSheet(); });

function renderExportSheet(canvas,baseName) {
  const name=`${baseName}.png`;
  canvas.toBlob(blob=>{
    if (!blob) { toast('导出失败，请重试'); return; }
    const url=URL.createObjectURL(blob);
    // 先触发浏览器原生下载，下载开始后再弹出保存弹窗（手机端补充长按存相册 / 分享）
    const a=document.createElement('a');
    a.href=url;
    a.download=name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    if (isMobile()) {
      setTimeout(()=>openSaveSheet('保存图纸',{ url, file: blob },name,'图纸已开始下载；可长按下方图片保存到相册，或点按钮再次下载 / 分享',url),400);
    } else {
      setTimeout(()=>URL.revokeObjectURL(url),2000);
    }
  },'image/png');
}

function exportPng() {
  if (!state.result) return;
  const opts={...state.drawOpts,showCellNumbers:true};
  const CELL=30;
  const layout=computeLayout(state.result,opts,CELL);
  let scale=1;
  const maxDim=Math.max(layout.width,layout.height);
  if (maxDim>4096) scale=4096/maxDim;
  const W=Math.round(layout.width*scale), H=Math.round(layout.height*scale);
  try {
    const off=document.createElement('canvas');
    off.width=W; off.height=H;
    const octx=off.getContext('2d');
    octx.setTransform(scale,0,0,scale,0,0);
    const drawOpts={...opts};
    if (state.audit) {
      drawOpts.highlightIsolated=state.opts.highlight;
      drawOpts.isolatedSet=new Set(state.audit.isolated);
      drawOpts.diagonalSet=new Set(state.audit.diagonalOnly);
    }
    drawSheet(octx,layout,state.result,drawOpts);
    renderExportSheet(off,`拼豆图纸_${state.result.gridSize}x${state.result.gridSize}`);
  } catch (err) {
    toast('导出失败，请重试');
  }
}

function exportCsv() {
  if (!state.result) return;
  const csv=buildStatsCSV(state.result.pixelData,state.colorSystem);
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const name=`拼豆清单_${state.result.gridSize}x${state.result.gridSize}.csv`;
  // 先触发浏览器原生下载，下载开始后再弹出保存弹窗（手机端可再次下载或分享）
  const a=document.createElement('a');
  a.href=url;
  a.download=name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  if (isMobile()) {
    setTimeout(()=>openSaveSheet('保存物料清单',{ url, file: blob },name,'清单已开始下载；CSV 适合用 Excel / WPS 打开，可点按钮再次下载或分享',null),400);
  } else {
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  }
}

chooseBtn.addEventListener('click',()=>fileInput.click());
uploadCard.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; if(f) readImage(f); e.target.value=''; });
generateBtn.addEventListener('click',generate);
customApply.addEventListener('click',()=>{
  const v=parseInt(customInput.value,10);
  if (!v||v<8||v>150) { toast('请输入 8~150 之间的尺寸'); return; }
  state.gridSize=v;
  renderChips($('sizeChips'),[{v:16,label:'16×16'},{v:24,label:'24×24'},{v:32,label:'32×32'},{v:48,label:'48×48'},{v:56,label:'56×56'},{v:64,label:'64×64'},{v:100,label:'100×100'}],()=>state.gridSize,v=>{state.gridSize=v;state.customSize='';if(state.result)generate();});
  if (state.result) generate();
});
customInput.addEventListener('keydown',e=>{ if(e.key==='Enter') customApply.click(); });
customInput.addEventListener('input',()=>{ customApply.classList.toggle('on',!!customInput.value); });

const optKeys={optBlank:'blankWhite',optNumbers:'showNumbers',optCoords:'showCoords',optGrid:'showGrid',optStats:'showStats',optHighlight:'highlight'};
Object.keys(optKeys).forEach(id=>{
  $(id).addEventListener('change',()=>{
    state.opts[optKeys[id]]=$(id).checked;
    if (state.result) generate();
  });
});

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('tab-active'));
    t.classList.add('tab-active');
    state.viewMode=t.dataset.mode;
    render();
  });
});

let mouseDrag=null;
canvas.addEventListener('mousedown',e=>{ mouseDrag={x:e.clientX,y:e.clientY}; });
window.addEventListener('mousemove',e=>{
  if (!mouseDrag||!state.view) return;
  state.view.tx+=e.clientX-mouseDrag.x;
  state.view.ty+=e.clientY-mouseDrag.y;
  mouseDrag={x:e.clientX,y:e.clientY};
  scheduleRender();
});
window.addEventListener('mouseup',()=>{ mouseDrag=null; });
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  zoomAt(e.clientX-rect.left,e.clientY-rect.top,e.deltaY<0?1.15:0.87);
},{passive:false});

let touches=new Map();
canvas.addEventListener('touchstart',e=>{
  for (const t of e.changedTouches) touches.set(t.identifier,{x:t.clientX,y:t.clientY});
  if (touches.size===2) mouseDrag=null;
},{passive:true});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if (!state.view) return;
  if (touches.size>=2) {
    const arr=[...touches.values()];
    const d0=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);
    for (const t of e.changedTouches) touches.set(t.identifier,{x:t.clientX,y:t.clientY});
    const arr2=[...touches.values()];
    const d1=Math.hypot(arr2[0].x-arr2[1].x,arr2[0].y-arr2[1].y);
    if (d0>0) {
      const rect=canvas.getBoundingClientRect();
      const mid={x:(arr2[0].x+arr2[1].x)/2-rect.left,y:(arr2[0].y+arr2[1].y)/2-rect.top};
      zoomAt(mid.x,mid.y,d1/d0);
    }
  } else if (touches.size===1) {
    const prev=[...touches.values()][0];
    const ct=e.changedTouches[0];
    state.view.tx+=ct.clientX-prev.x;
    state.view.ty+=ct.clientY-prev.y;
    touches.set(ct.identifier,{x:ct.clientX,y:ct.clientY});
    scheduleRender();
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{
  for (const t of e.changedTouches) touches.delete(t.identifier);
});
canvas.addEventListener('touchcancel',e=>{
  for (const t of e.changedTouches) touches.delete(t.identifier);
});

$('exportPng').addEventListener('click',exportPng);
$('exportCsv').addEventListener('click',exportCsv);

refresh();
</script>
</body>
